[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmdeg"
version = "0.1.0"
description = "疾患モデル動物の遺伝子発現データベースと閲覧 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=0.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26"]

[project.scripts]
dmdeg-ingest = "dmdeg.ingest:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py311"
